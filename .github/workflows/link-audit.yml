name: Link audit

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README_CN.md
      - 'docs/**/*.md'
      - scripts/audit_links.py
      - 'tests/**'
      - data/catalog-order.json
      - .github/workflows/link-audit.yml
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * 1'

permissions:
  contents: read

concurrency:
  group: link-audit-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test checker with deterministic local fixtures
        run: python -m unittest discover -s tests -v
      - name: Audit English, Chinese and documentation links (report only)
        run: python scripts/audit_links.py --output link-audit
      - name: Publish job summary
        if: always()
        run: |
          if [ -f link-audit/summary.md ]; then
            cat link-audit/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Link audit did not finish. Missing results are not evidence of broken links.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload full report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: link-audit-${{ github.run_id }}
          path: link-audit/
          retention-days: 30
          if-no-files-found: warn
