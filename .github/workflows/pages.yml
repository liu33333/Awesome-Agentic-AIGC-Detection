name: Build and deploy research website

on:
  push:
    branches: [main]
    paths:
      - README.md
      - README_CN.md
      - 'data/**'
      - 'site/**'
      - scripts/build_site.py
      - 'tests/**'
      - .github/workflows/pages.yml
  pull_request:
    paths:
      - README.md
      - README_CN.md
      - 'data/**'
      - 'site/**'
      - scripts/build_site.py
      - 'tests/**'
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Test catalogue synchronization and links
        run: python -m unittest discover -s tests -v
      - name: Generate bilingual website from README
        run: python scripts/build_site.py
      - name: Test search, combined filters and URL state
        run: |
          node --check site/assets/app.js
          node tests/site_filter_test.js _site/catalog.json
      - name: Check Pages configuration
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload website
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
