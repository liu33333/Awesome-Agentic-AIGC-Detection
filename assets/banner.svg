<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
<title id="title">Awesome Agentic AIGC Detection</title>
<desc id="description">An original conceptual illustration of layered landscape image frames, a highlighted image region and a magnified detail connected by evidence lines. This is artwork, not an actual detector result.</desc>
<defs>
