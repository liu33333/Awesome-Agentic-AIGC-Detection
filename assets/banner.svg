<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-labelledby="title description">
  <title id="title">Awesome Agentic AIGC Detection</title>
  <desc id="description">An original editorial illustration: visual, audio and text signals connect to an agentic investigation, a magnified image region and a structured evidence report.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M24 0H0V24" fill="none" stroke="#dfe5df" stroke-width="1"/></pattern>
